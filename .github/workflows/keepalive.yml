# Keeps the free Supabase project from pausing (it pauses after ~7 days without traffic).
# Every 3 days it calls the harmless ping() function.
# GitHub also turns off scheduled workflows in repos with no activity for 60 days,
# so once a month this workflow commits a tiny heartbeat file.
#
# Setup: repo > Settings > Secrets and variables > Actions > New repository secret:
#   SUPABASE_URL       e.g. https://abcd1234.supabase.co
#   SUPABASE_ANON_KEY  the anon / publishable key (the same one that is in docs/js/config.js)
name: keep-alive

on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          code=$(curl -s -o /tmp/out.txt -w '%{http_code}' -X POST "$SUPABASE_URL/rest/v1/rpc/ping" \
            -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H 'Content-Type: application/json' -d '{}')
          echo "HTTP $code: $(cat /tmp/out.txt)"
          test "$code" = "200"

      - uses: actions/checkout@v4

      - name: Monthly heartbeat commit
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt 2592000 ]; then
            date -u +%FT%TZ > .github/heartbeat.txt
            git config user.name "keep-alive bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/heartbeat.txt
            git commit -m "keep-alive heartbeat"
            git push
          else
            echo "Recent commit exists, no heartbeat needed."
          fi
